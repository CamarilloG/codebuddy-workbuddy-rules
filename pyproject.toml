[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebuddy-workbuddy-rules"
version = "0.1.0"
description = "Unofficial, auditable request compatibility rules for CodeBuddy and WorkBuddy"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools.packages.find]
include = ["buddy_rules*"]

[tool.setuptools.package-data]
buddy_rules = ["rules.json"]
